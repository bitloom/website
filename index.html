<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Glenmara: Still Life Artist</title>

        <style>
            @font-face {
              font-family: fredoka; 
              src: url(glenmara/fredoka.ttf);
            }

            body {
                font-family: fredoka;
                font-size: 3vh;
                color: #FFF !important;
                background-color: #A22D54 !important;
                background: none !important;
                text-shadow: 0px 0px 8px black;
                text-align: center;
                line-height: 4vh;
            }

            a {
                color: #FFF !important;
                font-size: 4vh; 
                line-height: 6vh;
                text-decoration: none;
                transition: 0.3s;
            }

            a:hover {
                text-shadow: 0px 0px 3px white;
            }

            a img {
                height: 8vh;
                transform: scale(1.0); 
                transition: 0.3s;
            }

            a img:hover {
                transform: scale(1.1); 
            }

            #background {
                background-image: url("glenmara/styles/photo.png");
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-position: center;
                background-size: cover;
                position: absolute;
                width: 100%;
                height: 100%;
                left: 0;
                top: -0;
                z-index: -1;
            }

            #paint { 
                right: 6vh; 
                bottom: 6vh; 
                width: 8vh; 
                height: 8vh;
                position: absolute;
                border: none;
                cursor: pointer;
                background-image: url("glenmara/paint-icon.png");
                background-size: cover;
                background-color: #00000000;
                transform: scale(1.0); 
                transition: 0.1s;
            }

            #paint:hover {
                transform: scale(1.1); 
                background-color: #00000000;
            }

            #paint:active {
                transform: scale(0.95); 
                background-color: #00000000;
            }
        </style>
    </head>

    <body>
        <img id="background"></img>

        <div>
            <div>
                <img src="glenmara/logo.png" style="height: 38vh;">
            </div>

            <div>
                <span>
                    Get creative as a still life artist<br>
                    as you settle into your new home<br>
                    on the wee Scottish isle of Glenmara<br>
                </span>
            </div>

            <div style="margin-top: 6vh;">
                <a href="https://store.steampowered.com/app/4022800/">
                    wishlist on steam
                </a>
            </div>

            <div>
                <a href="https://drive.google.com/drive/folders/1NB-6AOzflcI-gVRBEZrBLO_Qq67unywq?usp=drive_link">
                    view presskit
                </a>
            </div>

            <div style="margin-top: 6vh;">
                <a href="https://bsky.app/profile/bitloomgames.bsky.social" title="Bluesky">
                    <img src="glenmara/bluesky.png"></img>
                </a>

                <a href="https://www.instagram.com/bitloomgames/" title="Instagram">
                    <img src="glenmara/instagram.png"></img>
                </a>
            </div>

            <div>
                <a href="https://bitloomgames.com/" title="Bit Loom">
                    <img src="glenmara/bitloom-long.png"></img>
                </a>
            </div>
        </div>

        <button id="paint"></button>
    </body>

    <script>
        var styleIndex = 0;
        var styleImages = ["oils", "watercolour", "expressionist", "chalky", "charcoal", "pencil", "mosaic", "lino", "pop", "pixel", "photo"]

        var paint = document.getElementById("paint");
        var background = document.getElementById("background");

        paint.addEventListener("click", e => {
            styleIndex += 1;

            if (styleIndex >= styleImages.length)
            {
                styleIndex = 0;
            } 

            background.style.backgroundImage = "url('glenmara/styles/" + styleImages[styleIndex] + ".png')";
        });
    </script>
</html>
